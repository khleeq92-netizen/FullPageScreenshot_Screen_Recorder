<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Recording control – FullPage HD Capture</title><link rel="icon" href="icons/icon32.png"><link rel="stylesheet" href="ui.css">
<style>
  body { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; }
  .time { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
</style></head>
<body>
  <div class="row"><img src="icons/icon32.png" alt=""><b class="grow">Recording control</b><span class="badge" id="badge">…</span></div>
  <div id="msg" class="muted small">Chrome is asking what you want to share. Recording starts only after you choose and confirm.</div>
  <div class="time" id="time" style="display:none">0:00</div>
  <div class="muted small" id="meta"></div>
  <div class="meter" id="meter" style="display:none"><i></i></div>
  <div class="controls" id="controls" style="display:none"></div>
  <div class="notice warn small" id="warn" style="display:none"></div>
  <div class="muted small" id="hint" style="display:none">You can minimise this window. Closing it stops and saves the recording.</div>
<script type="module" src="recorder-window.js"></script></body></html>
