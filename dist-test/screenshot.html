<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenshot – FullPage HD Capture</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="ui.css">
<style>
  body { height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr; }
  .top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .top img.logo { width: 26px; height: 26px; }
  .top .title { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
  .top .url { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; display: block; }
  .tools { display: flex; align-items: center; gap: 4px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tools .sep { width: 1px; height: 24px; background: var(--border); margin: 0 6px; }
  .tools label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  .stage-wrap { overflow: auto; position: relative; background: repeating-conic-gradient(var(--panel-2) 0 25%, var(--bg) 0 50%) 0 0 / 20px 20px; }
  .stage { position: relative; margin: 20px auto; box-shadow: 0 2px 20px rgba(0,0,0,.25); background: #fff; }
  .stage img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; image-rendering: auto; }
  .stage.pixelated img { image-rendering: pixelated; }
  .stage svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage svg .sel { stroke: #2563eb; stroke-dasharray: 6 4; fill: none; vector-effect: non-scaling-stroke; stroke-width: 1.5; }
  .stage svg .handle { fill: #fff; stroke: #2563eb; vector-effect: non-scaling-stroke; stroke-width: 1.5; }
  .side { border-left: 1px solid var(--border); background: var(--panel); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .side h3 { margin: 0; }
  .zoom-ind { font-size: 12px; min-width: 48px; text-align: center; color: var(--muted); }
  textarea.text-edit { position: absolute; z-index: 5; border: 1px dashed #2563eb; background: rgba(255,255,255,.85); resize: both; font-weight: 700; line-height: 1.25; padding: 0; outline: none; }
  .crop-actions { position: absolute; z-index: 6; display: flex; gap: 6px; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<div class="top">
  <img class="logo" src="icons/icon48.png" alt="">
  <div class="grow" style="min-width:0"><div class="title" id="title">Loading…</div><a class="url" id="url" target="_blank" rel="noreferrer"></a></div>
  <span class="badge" id="status"></span>
  <a class="btn" href="app.html#history" id="to-history">Capture History</a>
</div>
<div class="tools" id="tools"></div>
<div class="main">
  <div class="stage-wrap" id="wrap"><div class="stage" id="stage"><div class="loading">Loading capture…</div></div></div>
  <aside class="side" id="side"></aside>
</div>
<script type="module" src="screenshot.js"></script>
</body>
</html>
