<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Editor – FullPage HD Capture</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="ui.css">
<style>
  body { height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
  .top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .top img { width: 26px; height: 26px; }
  .top .title { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; cursor: text; }
  .center { display: grid; grid-template-columns: 1fr 330px; min-height: 0; }
  .preview-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #0b0d12; }
  .preview-area { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding: 12px; }
  .preview-area canvas { max-width: 100%; max-height: 100%; background: #000; box-shadow: 0 4px 30px rgba(0,0,0,.5); touch-action: none; }
  .transport { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--border); }
  .transport .time { font: 600 13px ui-monospace, monospace; min-width: 150px; text-align: center; }
  .side { border-left: 1px solid var(--border); background: var(--panel); overflow: auto; display: flex; flex-direction: column; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .tabs button { flex: 1; border: none; background: none; padding: 10px 4px; font: 600 12px var(--font); color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.sel { color: var(--accent); border-bottom-color: var(--accent); }
  .pane { padding: 14px; display: none; flex-direction: column; gap: 12px; }
  .pane.show { display: flex; }
  .tool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tool-grid .btn { flex-direction: column; padding: 8px 4px; font-size: 11px; gap: 4px; height: auto; }
  .timeline { background: var(--panel); border-top: 1px solid var(--border); height: 230px; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .tl-bar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tl-body { display: grid; grid-template-columns: 110px 1fr; min-height: 0; overflow: hidden; }
  .tl-labels { border-right: 1px solid var(--border); padding-top: 24px; }
  .tl-labels div { height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .tl-scroll { overflow-x: auto; overflow-y: hidden; position: relative; }
  .tl-inner { position: relative; height: 100%; }
  .ruler { height: 24px; border-bottom: 1px solid var(--border); position: relative; font: 10px ui-monospace, monospace; color: var(--muted); cursor: pointer; }
  .ruler span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
  .ruler i { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--border); }
  .track { height: 40px; position: relative; border-bottom: 1px solid var(--border); }
  .clip { position: absolute; top: 4px; bottom: 4px; border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; background: #334155 center / auto 100% repeat-x; }
  .clip.video { background-color: #1e3a8a; }
  .clip.sel { border-color: #f59e0b; }
  .clip .lbl { position: absolute; left: 4px; top: 2px; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; white-space: nowrap; }
  .clip.audio { background: #134e4a; }
  .clip.audio canvas { width: 100%; height: 100%; display: block; }
  .clip.cam { background: #4c1d95; }
  .ov { position: absolute; top: 6px; height: 28px; border-radius: 5px; background: #b45309; color: #fff; font-size: 11px; padding: 0 6px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; cursor: grab; border: 2px solid transparent; }
  .ov.sel { border-color: #fff; box-shadow: 0 0 0 2px #f59e0b; }
  .ov .hl, .ov .hr { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; background: rgba(255,255,255,.25); }
  .ov .hl { left: 0; } .ov .hr { right: 0; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ef4444; pointer-events: none; z-index: 5; }
  .playhead::before { content: ''; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: #ef4444; }
  .loading-ov { position: absolute; inset: 0; display: grid; place-items: center; color: #cbd5e1; background: rgba(0,0,0,.6); z-index: 4; text-align: center; padding: 20px; }
  .rangepair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>
<div class="top">
  <img src="icons/icon48.png" alt="">
  <div class="title" id="title" title="Double-click to rename">Loading…</div>
  <span class="muted small grow" id="src-info"></span>
  <button class="btn icon" id="undo" title="Undo (Ctrl+Z)"></button>
  <button class="btn icon" id="redo" title="Redo (Ctrl+Shift+Z)"></button>
  <a class="btn" href="app.html#history">Capture History</a>
  <button class="btn primary" id="open-export">Export</button>
</div>
<div class="center">
  <div class="preview-col">
    <div class="preview-area" id="preview-area"><canvas id="preview"></canvas><div class="loading-ov" id="loading">Loading recording…</div></div>
    <div class="transport" id="transport"></div>
  </div>
  <aside class="side">
    <div class="tabs" id="tabs"></div>
    <div class="pane" data-pane="edit" id="pane-edit"></div>
    <div class="pane" data-pane="overlay" id="pane-overlay"></div>
    <div class="pane" data-pane="audio" id="pane-audio"></div>
    <div class="pane" data-pane="export" id="pane-export"></div>
  </aside>
</div>
<div class="timeline">
  <div class="tl-bar" id="tl-bar"></div>
  <div class="tl-body">
    <div class="tl-labels" id="tl-labels"></div>
    <div class="tl-scroll" id="tl-scroll"><div class="tl-inner" id="tl-inner"></div></div>
  </div>
</div>
<video id="src-video" style="display:none" preload="auto" playsinline></video>
<video id="cam-video" style="display:none" preload="auto" muted playsinline></video>
<script type="module" src="video-editor.js"></script>
</body>
</html>
